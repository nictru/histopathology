name: qupath_project
description: Save a native QuPath project with slide images and preloaded objects.
keywords:
  - histology
  - visualization
  - qupath
tools:
  - qupath:
      description: Software for digital pathology image analysis.
      homepage: https://qupath.github.io/
      documentation: https://qupath.readthedocs.io/
      licence: ["GPL-3.0-or-later"]
      identifier: biotools:qupath
input:
  - slides:
      type: directory
      description: Per-slide directories with OME-TIFF images and QuPath GeoJSON objects.
  - archive:
      type: file
      description: Pinned QuPath Linux release archive used to run QuPath headlessly.
      pattern: "*.tar.xz"
output:
  project:
    - qupath:
        type: directory
        description: Native QuPath project with images and saved object hierarchies.
        pattern: qupath
  versions:
    - versions.yml:
        type: file
        description: Software versions.
        pattern: versions.yml
topics:
  versions:
    - versions.yml:
        type: file
        description: Software versions.
authors:
