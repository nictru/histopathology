name: czi_totiff
description: Convert a brightfield Zeiss CZI to a LazySlide-readable pyramidal BigTIFF.
keywords:
  - histology
  - whole-slide imaging
  - tiff
tools:
  - pylibCZIrw:
      description: Zeiss Python bindings for reading and writing CZI files.
      homepage: https://github.com/ZEISS/pylibczirw
      documentation: https://zeiss.github.io/pylibczirw/
      licence: ["LGPL v3"]
      identifier: ""
  - libvips:
      description: Demand-driven image processing library.
      homepage: https://www.libvips.org/
      documentation: https://www.libvips.org/API/current/method.Image.tiffsave.html
      licence: ["LGPL v2.1+"]
      identifier: ""
input:
  - - meta:
        type: map
        description: Sample metadata containing the slide ID.
    - slide:
        type: file
        description: Single-plane 8-bit brightfield Zeiss CZI slide.
        pattern: "*.czi"
    - mpp:
        type: string
        description: Verified microns per pixel. Pass an empty string to use the CZI X/Y calibration.
    - scene:
        type: string
        description: Zeiss scene index. Pass an empty string for a slide with zero or one scene.
output:
  slide:
    - - meta:
          type: map
          description: Sample metadata containing the slide ID.
      - "${prefix}.tif":
          type: file
          description: Lossless tiled pyramidal BigTIFF.
          pattern: "*.tif"
      - "${prefix}.ingest.json":
          type: file
          description: Conversion report with source origin, calibration, and verified pyramid dimensions.
          pattern: "*.ingest.json"
  versions:
    - "versions.yml":
        type: file
        description: Software versions.
        pattern: "versions.yml"
topics:
  versions:
    - "versions.yml":
        type: file
        description: Software versions.
        pattern: "versions.yml"
authors:
  - "@nictru"
maintainers:
  - "@nictru"
