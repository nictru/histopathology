name: vips_tiffsave
description: Convert a flat RGB TIFF or JPEG to a LazySlide-readable pyramidal BigTIFF.
keywords:
  - histology
  - whole-slide imaging
  - tiff
tools:
  - libvips:
      description: Demand-driven image processing library.
      homepage: https://www.libvips.org/
      documentation: https://www.libvips.org/API/current/method.Image.tiffsave.html
      licence: ["LGPL v2.1+"]
      identifier: ""
input:
  - - meta:
        type: map
        description: Sample metadata containing the slide ID.
    - slide:
        type: file
        description: Flat, 8-bit RGB TIFF or JPEG slide in its native orientation.
        pattern: "*.{tif,tiff,jpg,jpeg}"
    - mpp:
        type: string
        description: Verified microns per pixel. Pass an empty string to use the TIFF resolution tags.
output:
  slide:
    - - meta:
          type: map
          description: Sample metadata containing the slide ID.
      - "${prefix}.tif":
          type: file
          description: Lossless tiled pyramidal BigTIFF.
          pattern: "*.tif"
      - "${prefix}.ingest.json":
          type: file
          description: Conversion report with source origin, calibration, and verified pyramid dimensions.
          pattern: "*.ingest.json"
  versions:
    - "versions.yml":
        type: file
        description: Software versions.
        pattern: "versions.yml"
topics:
  versions:
    - "versions.yml":
        type: file
        description: Software versions.
        pattern: "versions.yml"
authors:
  - "@nictru"
maintainers:
  - "@nictru"
