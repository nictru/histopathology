name: huggingface_download
description: Download a file from the Hugging Face Hub at an immutable revision, using the HF_TOKEN secret when configured.
keywords:
  - download
  - huggingface
  - model
  - dataset
tools:
  - huggingface_hub:
      description: Client for accessing models, datasets, and spaces on the Hugging Face Hub.
      homepage: https://huggingface.co/docs/huggingface_hub/
      documentation: https://huggingface.co/docs/huggingface_hub/en/guides/cli
      tool_dev_url: https://github.com/huggingface/huggingface_hub
      licence: ["Apache-2.0"]
input:
  - repo_type:
      type: string
      description: Hugging Face repository type (model, dataset, or space).
  - repo_id:
      type: string
      description: Hugging Face repository ID, typically in owner/name form.
  - revision:
      type: string
      description: Full 40-character commit hash for the revision to download.
  - filename:
      type: string
      description: Path to the file within the repository.
output:
  resource:
    - "download/${filename}":
        type: file
        description: The downloaded file.
  versions_huggingface_hub:
    - versions.yml:
        type: file
        description: Software versions.
        pattern: "versions.yml"
topics:
  versions:
    - versions.yml:
        type: file
        description: Software versions.
        pattern: "versions.yml"
authors:
  - "@nictru"
maintainers:
  - "@nictru"
