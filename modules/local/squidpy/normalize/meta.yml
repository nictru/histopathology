name: squidpy_normalize
description: Fit or apply a Squidpy stain reference to a WSIData Zarr image pyramid.
keywords:
  - histology
  - stain normalization
  - whole-slide imaging
tools:
  - squidpy:
      description: Spatial analysis and image processing.
      homepage: https://squidpy.scverse.org/
      documentation: https://squidpy.readthedocs.io/
      licence: ["BSD-3-Clause"]
      identifier: biotools:squidpy
input:
  - - meta:
        type: map
        description: Sample metadata containing the slide ID.
    - slide:
        type: directory
        description: WSIData store containing an RGB image under the wsi key.
        pattern: "*.zarr"
  - fitted_reference:
      type: file
      description: Fitted stain statistics used in apply mode. Pass an empty list in fit mode.
      pattern: "*.stain_reference.json"
  - method:
      type: string
      description: Squidpy stain normalization method.
      enum: [macenko, reinhard, vahadane]
  - fit_reference:
      type: boolean
      description: Fit a reference when true, or normalize a slide when false.
output:
  reference:
    - - meta:
          type: map
          description: Sample metadata containing the reference slide ID.
      - "${prefix}.stain_reference.json":
          type: file
          description: Fitted Squidpy reference statistics and sample ID.
          pattern: "*.stain_reference.json"
  slide:
    - - meta:
          type: map
          description: Sample metadata containing the slide ID.
      - "${prefix}.normalized.zarr":
          type: directory
          description: Normalized WSIData store with fitted reference provenance in its attributes.
          pattern: "*.normalized.zarr"
  versions:
    - "versions.yml":
        type: file
        description: Software versions.
        pattern: "versions.yml"
topics:
  versions:
    - "versions.yml":
        type: file
        description: Software versions.
        pattern: "versions.yml"
authors:
  - "@nictru"
maintainers:
  - "@nictru"
