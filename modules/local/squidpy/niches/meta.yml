name: squidpy_niches
description: Identify spatial niches from local cell-type composition and plot them on the original slide.
keywords:
  - histology
  - cell types
  - spatial niches
tools:
  - squidpy:
      description: A framework for spatial omics analysis.
      homepage: https://squidpy.readthedocs.io/
      documentation: https://squidpy.readthedocs.io/en/stable/api/squidpy.gr.calculate_niche_neighborhood.html
      doi: 10.1038/s41592-021-01358-2
      licence: ["BSD-3-Clause"]
input:
  - - meta:
        type: map
        description: Slide metadata with the sample identifier.
    - instances:
        type: directory
        description: Cell or nucleus polygons with predicted cell types.
        pattern: "*.zarr"
    - slide:
        type: directory
        description: Original calibrated slide used for the overlay and representative crops.
        pattern: "*.zarr"
  - radius_um:
      type: float
      description: Maximum centroid distance in microns.
  - resolution:
      type: float
      description: Positive Leiden clustering resolution.
output:
  niches:
    - - meta:
          type: map
          description: Slide metadata with the sample identifier.
      - "${prefix}.cell_niches.zarr":
          type: directory
          description: SpatialData store with source shapes and a linked table of niche assignments and neighborhood compositions.
          pattern: "*.cell_niches.zarr"
  multiqc_files:
    - "${prefix}.cell_niches.*_mqc.json":
        type: file
        description: MultiQC slide overlay and representative crops, plus a native composition heatmap when niches are assigned.
        pattern: "*_mqc.json"
  versions:
    - versions.yml:
        type: file
        description: Software versions.
        pattern: versions.yml
topics:
  versions:
    - versions.yml:
        type: file
        description: Software versions.
        pattern: versions.yml
authors:
  - "@nictru"
maintainers:
  - "@nictru"
