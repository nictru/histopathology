name: squidpy_neighborhoodenrichment
description: Measure spatial neighborhood enrichment between predicted cell types.
keywords:
  - histology
  - cell types
  - spatial neighborhoods
tools:
  - squidpy:
      description: A framework for spatial omics analysis.
      homepage: https://squidpy.readthedocs.io/
      documentation: https://squidpy.readthedocs.io/en/latest/modules/gr.html
      doi: 10.1038/s41592-021-01358-2
      licence: ["BSD-3-Clause"]
input:
  - - meta:
        type: map
        description: Slide metadata with the sample identifier.
    - instances:
        type: directory
        description: Cell or nucleus polygons and predicted class labels where available.
        pattern: "*.zarr"
    - slide:
        type: directory
        description: Original calibrated slide store.
        pattern: "*.zarr"
  - radius_um:
      type: float
      description: Maximum centroid distance in microns.
  - permutations:
      type: integer
      description: Number of label permutations for the null distribution.
output:
  neighborhoods:
    - - meta:
          type: map
          description: Slide metadata with the sample identifier.
      - "${prefix}.cell_neighborhoods.csv":
          type: file
          description: Per-class pairs with the number of observed edges and neighborhood enrichment z-scores.
          pattern: "*.cell_neighborhoods.csv"
  multiqc_files:
    - "${prefix}.cell_neighborhoods_mqc.json":
        type: file
        description: Native heatmap of neighborhood enrichment z-scores when a graph is available.
        pattern: "*_mqc.json"
  versions:
    - versions.yml:
        type: file
        description: Software versions.
        pattern: versions.yml
topics:
  versions:
    - versions.yml:
        type: file
        description: Software versions.
        pattern: versions.yml
authors:
  - "@nictru"
maintainers:
  - "@nictru"
