name: wsidata_ingest
description: Read a raw slide with a registered WSIData reader and persist its RGB pyramid as SpatialData Zarr.
keywords:
  - histology
  - whole-slide imaging
  - zarr
tools:
  - wsidata:
      description: Whole-slide image readers and SpatialData storage.
      homepage: https://github.com/rendeirolab/wsidata
      documentation: https://wsidata.readthedocs.io/
      licence: ["MIT"]
      identifier: ""
input:
  - - meta:
        type: map
        description: Sample metadata containing the slide ID.
    - slide:
        type: file
        description: Original CZI, TIFF, or JPEG slide.
        pattern: "*.{czi,tif,tiff,jpg,jpeg}"
    - scene:
        type: integer
        description: Zero-based CZI scene index, or an empty value for a single-scene input.
    - mpp:
        type: float
        description: Pixel size override in microns, or an empty value to read the source calibration.
output:
  slide:
    - - meta:
          type: map
          description: Sample metadata containing the slide ID.
      - "${prefix}.zarr":
          type: directory
          description: Self-contained WSIData store with the image saved under the wsi key.
          pattern: "*.zarr"
  versions:
    - "versions.yml":
        type: file
        description: Software versions.
        pattern: "versions.yml"
topics:
  versions:
    - "versions.yml":
        type: file
        description: Software versions.
        pattern: "versions.yml"
authors:
  - "@nictru"
maintainers:
  - "@nictru"
