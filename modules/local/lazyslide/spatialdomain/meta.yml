name: lazyslide_spatialdomain
description: Cluster spatially smoothed tile embeddings and plot the domains on the original slide.
keywords:
  - histology
  - embeddings
  - spatial clustering
tools:
  - lazyslide:
      description: Whole-slide image analysis for digital pathology.
      homepage: https://github.com/rendeirolab/LazySlide
      documentation: https://lazyslide.readthedocs.io/
      licence: ["MIT"]
      identifier: biotools:lazyslide
input:
  - - meta:
        type: map
        description: Sample metadata containing the slide ID.
    - embeddings:
        type: directory
        description: SpatialData store containing tile geometries and a linked AnnData feature table.
        pattern: "*.embeddings.zarr"
    - tile_model:
        type: string
        description: Encoder used to generate the tile embeddings.
    - slide:
        type: directory
        description: Original WSIData store used as the overlay background.
        pattern: "*.zarr"
  - resolution:
      type: float
      description: Positive Leiden clustering resolution.
output:
  domains:
    - - meta:
          type: map
          description: Sample metadata containing the slide ID.
      - "${prefix}.${tile_model}.tissue_domains.zarr":
          type: directory
          description: SpatialData store containing tile polygons labeled with their domain.
          pattern: "*.tissue_domains.zarr"
  multiqc_files:
    - "*_mqc.json":
        type: file
        description: MultiQC custom content with a semi-transparent domain overlay.
        pattern: "*_mqc.json"
  versions:
    - versions.yml:
        type: file
        description: Software versions.
        pattern: versions.yml
topics:
  versions:
    - versions.yml:
        type: file
        description: Software versions.
        pattern: versions.yml
authors:
  - "@nictru"
maintainers:
  - "@nictru"
