name: lazyslide_cells
description: Segment nuclei or cells on a whole-slide tissue tile grid with LazySlide.
keywords:
  - histology
  - nuclei
  - cell segmentation
tools:
  - lazyslide:
      description: Whole-slide image analysis for digital pathology.
      homepage: https://github.com/rendeirolab/LazySlide
      documentation: https://lazyslide.readthedocs.io/
      licence: ["MIT"]
      identifier: biotools:lazyslide
input:
  - - meta:
        type: map
        description: Sample metadata containing the slide ID.
    - slide:
        type: directory
        description: WSIData store with the RGB image under the wsi key.
        pattern: "*.zarr"
    - tiles:
        type: directory
        description: Matching SpatialData store with tile and tissue shapes and the tile specification.
        pattern: "*.tiles.zarr"
  - model:
      type: string
      description: LazySlide segmentation model.
      enum: [instanseg, cellpose, nulite, histoplus]
  - checkpoint:
      type: file
      description: Local checkpoint staged for the selected model and grid.
output:
  cells:
    - - meta:
          type: map
          description: Sample metadata containing the slide ID.
      - "${prefix}.${model}.cells.zarr":
          type: directory
          description: SpatialData store with instance polygons, class labels where supported, and segmentation metadata.
          pattern: "*.cells.zarr"
  versions:
    - versions.yml:
        type: file
        description: Software versions.
        pattern: versions.yml
topics:
  versions:
    - versions.yml:
        type: file
        description: Software versions.
        pattern: versions.yml
authors:
  - "@nictru"
maintainers:
  - "@nictru"
