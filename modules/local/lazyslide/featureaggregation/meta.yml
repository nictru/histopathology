name: lazyslide_featureaggregation
description: Aggregate tissue tile embeddings into one whole-slide embedding.
keywords:
  - histology
  - embeddings
  - feature aggregation
tools:
  - lazyslide:
      description: Whole-slide image analysis for digital pathology.
      homepage: https://github.com/rendeirolab/LazySlide
      documentation: https://lazyslide.readthedocs.io/
      licence: ["MIT"]
      identifier: biotools:lazyslide
input:
  - - meta:
        type: map
        description: Sample metadata containing the slide ID.
    - embeddings:
        type: directory
        description: SpatialData store containing tile geometries and a linked AnnData feature table.
        pattern: "*.embeddings.zarr"
    - slide:
        type: directory
        description: Matching WSIData store defining the slide coordinate system.
        pattern: "*.zarr"
    - tile_model:
        type: string
        description: Encoder used to generate the tile embeddings.
    - method:
        type: string
        description: Pooling reduction or learned slide encoder.
output:
  embeddings:
    - - meta:
          type: map
          description: Sample metadata containing the slide ID.
      - "${prefix}.${tile_model}.${method}.slide_embedding.h5ad":
          type: file
          description: AnnData with one embedding row for the slide or zero rows when no tiles are available.
          pattern: "*.slide_embedding.h5ad"
  versions:
    - versions.yml:
        type: file
        description: Software versions.
        pattern: versions.yml
topics:
  versions:
    - versions.yml:
        type: file
        description: Software versions.
        pattern: versions.yml
authors:
  - "@nictru"
maintainers:
  - "@nictru"
