name: lazyslide_featureextraction
description: Extract tile embeddings from whole-slide images using LazySlide.
keywords:
  - histology
  - embeddings
  - feature extraction
tools:
  - lazyslide:
      description: Whole-slide image analysis for digital pathology.
      homepage: https://github.com/rendeirolab/LazySlide
      documentation: https://lazyslide.readthedocs.io/
      licence: ["MIT"]
      identifier: biotools:lazyslide
input:
  - - meta:
        type: map
        description: Sample metadata containing the slide ID.
    - slide:
        type: directory
        description: WSIData store with the RGB image under the wsi key.
        pattern: "*.zarr"
    - tiles:
        type: directory
        description: SpatialData store with tile and tissue shapes and the tile specification.
        pattern: "*.tiles.zarr"
    - model:
        type: string
        description: Pretrained tile encoder.
  - batch_size:
      type: integer
      description: Number of tiles per inference batch.
output:
  embeddings:
    - - meta:
          type: map
          description: Sample metadata containing the slide ID.
      - "${prefix}.${model}.embeddings.zarr":
          type: directory
          description: SpatialData store with tile geometries, a linked AnnData feature table, and model provenance.
          pattern: "*.embeddings.zarr"
  versions:
    - versions.yml:
        type: file
        description: Software versions.
        pattern: versions.yml
topics:
  versions:
    - versions.yml:
        type: file
        description: Software versions.
        pattern: versions.yml
authors:
  - "@nictru"
maintainers:
  - "@nictru"
