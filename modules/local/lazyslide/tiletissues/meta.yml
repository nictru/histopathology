# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: lazyslide_tiletissues
description: Generate a WSIData tile grid within a precomputed tissue mask.
keywords:
  - histology
  - tissue tiling
  - whole-slide imaging
tools:
  - lazyslide:
      description: Whole-slide image analysis for digital pathology.
      homepage: https://github.com/rendeirolab/LazySlide
      documentation: https://lazyslide.readthedocs.io/
      licence: ["MIT"]
      identifier: biotools:lazyslide
input:
  - - meta:
        type: map
        description: Sample metadata containing the slide ID.
    - slide:
        type: directory
        description: WSIData store with its RGB image under the wsi key.
        pattern: "*.zarr"
    - tissue_mask:
        type: directory
        description: Matching SpatialData store with the wsi_tissue label.
        pattern: "*.tissue.zarr"
  - tile_px:
      type: integer
      description: Tile width and height in pixels at the requested MPP.
  - mpp:
      type: float
      description: Tile resolution in microns per pixel. Pass an empty string to use the native slide MPP.
  - overlap:
      type: float
      description: Fractional overlap between adjacent tiles in the range [0, 1).
  - background_fraction:
      type: float
      description: Maximum fraction of a tile that may fall outside the tissue mask.
output:
  tiles:
    - - meta:
          type: map
          description: Sample metadata containing the slide ID.
      - "${prefix}.tiles.zarr":
          type: directory
          description: SpatialData store containing tile shapes and a WSIData tile specification for slides with tiles.
          pattern: "*.tiles.zarr"
  versions:
    - versions.yml:
        type: file
        description: Software versions.
        pattern: versions.yml
topics:
  versions:
    - versions.yml:
        type: file
        description: Software versions.
        pattern: versions.yml
authors:
  - "@nictru"
maintainers:
  - "@nictru"
