name: lazyslide_tissueregions
description: Dissolve clustered tiles into tissue region polygons and measure the tissue area within them.
keywords:
  - histology
  - tissue regions
  - spatial domains
tools:
  - lazyslide:
      description: Whole-slide image analysis for digital pathology.
      homepage: https://github.com/rendeirolab/LazySlide
      documentation: https://lazyslide.readthedocs.io/
      licence: ["MIT"]
      identifier: biotools:lazyslide
input:
  - - meta:
        type: map
        description: Slide metadata containing the sample ID.
    - domains:
        type: directory
        description: SpatialData store containing tile polygons and slide-local domain labels.
        pattern: "*.tissue_domains.zarr"
    - slide:
        type: directory
        description: Calibrated original slide in a WSIData store.
        pattern: "*.zarr"
    - tissue:
        type: directory
        description: Primary foreground tissue mask used for tiling.
        pattern: "*.tissue.zarr"
  - tile_model:
      type: string
      description: Encoder used to generate the tissue domains.
output:
  regions:
    - - meta:
          type: map
          description: Slide metadata containing the sample ID.
      - "${prefix}.${tile_model}.tissue_regions.zarr":
          type: directory
          description: SpatialData store containing labeled region polygons and their tissue areas.
          pattern: "*.tissue_regions.zarr"
  multiqc_files:
    - "${prefix}.${tile_model}.tissue_regions_mqc.json":
        type: file
        description: Tissue region overlay on the original slide and summary of its area.
        pattern: "*.tissue_regions_mqc.json"
  versions:
    - versions.yml:
        type: file
        description: Software versions.
        pattern: versions.yml
topics:
  versions:
    - versions.yml:
        type: file
        description: Software versions.
        pattern: versions.yml
authors:
  - "@nictru"
maintainers:
  - "@nictru"
