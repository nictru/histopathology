name: lazyslide_findtissues
description: Detect tissue in a WSIData Zarr using LazySlide and store an aligned binary label.
keywords:
  - histology
  - tissue detection
  - whole-slide imaging
tools:
  - lazyslide:
      description: Whole-slide image analysis for digital pathology.
      homepage: https://github.com/rendeirolab/LazySlide
      documentation: https://lazyslide.readthedocs.io/
      licence: ["MIT"]
      identifier: biotools:lazyslide
input:
  - - meta:
        type: map
        description: Sample metadata containing the slide ID.
    - slide:
        type: directory
        description: WSIData store with its RGB image under the wsi key.
        pattern: "*.zarr"
output:
  mask:
    - - meta:
          type: map
          description: Sample metadata containing the slide ID.
      - "${prefix}.tissue.zarr":
          type: directory
          description: SpatialData store with an aligned binary label under the wsi_tissue key.
          pattern: "*.tissue.zarr"
  multiqc_files:
    - "${prefix}.tissue_mqc.json":
        type: file
        description: Tissue mask overlay on the original slide.
        pattern: "*_mqc.json"
  versions:
    - versions.yml:
        type: file
        description: Software versions.
        pattern: versions.yml
topics:
  versions:
    - versions.yml:
        type: file
        description: Software versions.
        pattern: versions.yml
authors:
  - "@nictru"
maintainers:
  - "@nictru"
