name: spatialdata_qupathexport
description: Convert a slide and its SpatialData layers to image and object files for QuPath.
keywords:
  - histology
  - spatialdata
  - qupath
tools:
  - lazyslide:
      description: Whole-slide image analysis for digital pathology.
      homepage: https://github.com/rendeirolab/LazySlide
      documentation: https://lazyslide.readthedocs.io/
      licence: ["MIT"]
      identifier: biotools:lazyslide
input:
  - - meta:
        type: map
        description: Slide metadata containing the sample ID.
    - kinds:
        type: list
        description: Source layer categories in the order of their stores.
    - stores:
        type: directory
        description: Slide images and spatial result layers for a single sample.
        pattern: "*.zarr"
output:
  slide:
    - - meta:
          type: map
          description: Slide metadata containing the sample ID.
      - "${prefix}":
          type: directory
          description: Pyramidal OME-TIFF images and QuPath GeoJSON objects for the slide.
          pattern: "${prefix}"
  versions:
    - versions.yml:
        type: file
        description: Software versions.
        pattern: versions.yml
topics:
  versions:
    - versions.yml:
        type: file
        description: Software versions.
authors:
  - "@nictru"
maintainers:
  - "@nictru"
