# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: spatialdata_segmentationagreement
description: Compare whole-slide segmentations by foreground overlap and one-to-one instance matching.
keywords:
  - histology
  - cell segmentation
  - agreement
tools:
  - spatialdata:
      description: A storage format and processing library for spatial omics data.
      homepage: https://spatialdata.scverse.org/
      documentation: https://spatialdata.scverse.org/en/stable/
      licence: ["BSD-3-Clause"]
  - shapely:
      description: Manipulate and analyze planar geometric objects.
      homepage: https://shapely.readthedocs.io/
      licence: ["BSD-3-Clause"]
  - scipy:
      description: Scientific computing algorithms for Python.
      homepage: https://scipy.org/
      licence: ["BSD-3-Clause"]
input:
  - - meta:
        type: map
        description: Slide metadata with the sample identifier.
    - segmentations:
        type: directory
        description: Two or more SpatialData stores with cell or nucleus shapes for the same slide.
        pattern: "*.cells.zarr"
output:
  agreement:
    - - meta:
          type: map
          description: Slide metadata with the sample identifier.
      - "${prefix}.segmentation_agreement.csv":
          type: file
          description: Foreground and instance agreement scores for all ordered pairs of methods.
          pattern: "*.segmentation_agreement.csv"
  multiqc_files:
    - "${prefix}.segmentation_agreement_mqc.json":
        type: file
        description: Tabbed heatmaps of pairwise agreement metrics.
        pattern: "*_mqc.json"
  versions:
    - versions.yml:
        type: file
        description: Software versions.
        pattern: versions.yml
topics:
  versions:
    - versions.yml:
        type: file
        description: Software versions.
        pattern: versions.yml
authors:
  - "@nictru"
maintainers:
  - "@nictru"
