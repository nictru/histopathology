name: spatialdata_cellfeatures
description: Measure cell or nucleus morphology and summarize their composition within optional tissue regions.
keywords:
  - histology
  - cell morphology
  - tissue regions
tools:
  - spatialdata:
      description: A storage format and processing library for spatial omics data.
      homepage: https://spatialdata.scverse.org/
      documentation: https://spatialdata.scverse.org/en/stable/
      licence: ["BSD-3-Clause"]
  - shapely:
      description: Manipulate and analyze planar geometric objects.
      homepage: https://shapely.readthedocs.io/
      licence: ["BSD-3-Clause"]
input:
  - - meta:
        type: map
        description: Slide metadata containing the sample ID.
    - instances:
        type: directory
        description: Segmented cell or nucleus polygons and predicted cell types when available.
        pattern: "*.zarr"
    - slide:
        type: directory
        description: Calibrated original slide in a WSIData store.
        pattern: "*.zarr"
    - regions:
        type: directory
        description: Optional tissue region polygons and density denominators.
        pattern: "*.tissue_regions.zarr"
    - niches:
        type: directory
        description: Optional per-instance niche assignments for this cell-typing source.
        pattern: "*.cell_niches.zarr"
output:
  features:
    - - meta:
          type: map
          description: Slide metadata containing the sample ID.
      - "${prefix}.cell_features.zarr":
          type: directory
          description: SpatialData store with original instance polygons and a linked morphology table.
          pattern: "*.cell_features.zarr"
  composition:
    - - meta:
          type: map
          description: Slide metadata containing the sample ID.
      - "${prefix}.region_composition.csv":
          type: file
          description: Optional counts, proportions, and densities for regions of the slide.
          pattern: "*.region_composition.csv"
  multiqc_files:
    - "${prefix}.cell_features.*_mqc.json":
        type: file
        description: MultiQC reports for morphology distributions and regional composition when available.
        pattern: "*_mqc.json"
  versions:
    - versions.yml:
        type: file
        description: Software versions.
        pattern: versions.yml
topics:
  versions:
    - versions.yml:
        type: file
        description: Software versions.
        pattern: versions.yml
authors:
  - "@nictru"
maintainers:
  - "@nictru"
