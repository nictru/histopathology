# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: spatialdata_celltypecomposition
description: Summarize cell counts, proportions, and tissue-normalized densities for a slide.
keywords:
  - histology
  - cell types
  - density
tools:
  - spatialdata:
      description: A storage format and processing library for spatial omics data.
      homepage: https://spatialdata.scverse.org/
      documentation: https://spatialdata.scverse.org/en/stable/
      licence: ["BSD-3-Clause"]
input:
  - - meta:
        type: map
        description: Slide metadata with the sample identifier.
    - instances:
        type: directory
        description: Cell or nucleus polygons with segmentation and optional classification metadata.
        pattern: "*.zarr"
    - slide:
        type: directory
        description: Original slide store with calibrated level-0 pixel size.
        pattern: "*.zarr"
    - tissue:
        type: directory
        description: Primary tissue mask in slide coordinates.
        pattern: "*.tissue.zarr"
output:
  composition:
    - - meta:
          type: map
          description: Slide metadata with the sample identifier.
      - "${prefix}.cell_type_composition.csv":
          type: file
          description: Counts, proportions, and densities for all instances and each observed class.
          pattern: "*.cell_type_composition.csv"
  multiqc_files:
    - "${prefix}.cell_type_*_mqc.json":
        type: file
        description: Native MultiQC table and composition bar plot data.
        pattern: "*_mqc.json"
  versions:
    - versions.yml:
        type: file
        description: Software versions.
        pattern: versions.yml
topics:
  versions:
    - versions.yml:
        type: file
        description: Software versions.
        pattern: versions.yml
authors:
  - "@nictru"
maintainers:
  - "@nictru"
