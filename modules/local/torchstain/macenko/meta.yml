name: torchstain_macenko
description: Apply slide-wide Macenko stain normalization to an ingested H&E WSIData store.
keywords:
  - histology
  - stain normalization
  - macenko
tools:
  - torchstain:
      description: Stain normalization tools for histology.
      homepage: https://github.com/EIDOSLAB/torchstain
      documentation: https://lazyslide.readthedocs.io/en/v0.13.0/tutorials/gene_expression_prediction.html
      licence: ["MIT"]
      identifier: ""
input:
  - - meta:
        type: map
        description: Sample metadata containing the slide ID.
    - slide:
        type: file
        description: Ingested WSIData Zarr store containing an 8-bit RGB image pyramid.
        pattern: "*.zarr"
output:
  slide:
    - - meta:
          type: map
          description: Sample metadata containing the slide ID.
      - "${prefix}.normalized.zarr":
          type: directory
          description: Lossless WSIData Zarr store with the source dimensions and MPP.
          pattern: "*.normalized.zarr"
      - "${prefix}.normalization.json":
          type: file
          description: Normalization settings, calibration sample size, and any brightness-only fallback.
          pattern: "*.normalization.json"
  versions:
    - "versions.yml":
        type: file
        description: Software versions.
        pattern: "versions.yml"
topics:
  versions:
    - "versions.yml":
        type: file
        description: Software versions.
        pattern: "versions.yml"
authors:
  - "@nictru"
maintainers:
  - "@nictru"
