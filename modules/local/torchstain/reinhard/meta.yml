name: torchstain_reinhard
description: Fit a Reinhard reference or apply it to an ingested slide.
keywords:
  - histology
  - stain normalization
  - reinhard
tools:
  - torchstain:
      description: Stain normalization tools for histology.
      homepage: https://github.com/EIDOSLAB/torchstain
      documentation: https://github.com/EIDOSLAB/torchstain#implemented-algorithms
      licence: ["MIT"]
      identifier: ""
input:
  - - meta:
        type: map
        description: Sample metadata containing the slide ID.
    - slide:
        type: file
        description: Ingested WSIData Zarr store containing an 8-bit RGB image pyramid.
        pattern: "*.zarr"
  - fitted_reference:
      type: file
      description: Fitted reference statistics used in normalization mode. Pass an empty list in reference-fitting mode.
      pattern: "*.reinhard_reference.json"
  - modified:
      type: boolean
      description: Select Modified Reinhard when true, or standard Reinhard when false.
  - fit_reference:
      type: boolean
      description: Fit a reference when true, or normalize a slide when false.
output:
  reference:
    - - meta:
          type: map
          description: Sample metadata containing the reference slide ID.
      - "${prefix}.reinhard_reference.json":
          type: file
          description: Fitted means and standard deviations of the Lab color channels, emitted in reference-fitting mode.
          pattern: "*.reinhard_reference.json"
  slide:
    - - meta:
          type: map
          description: Sample metadata containing the slide ID.
      - "${prefix}.normalized.zarr":
          type: directory
          description: Lossless normalized WSIData Zarr store with the source dimensions and MPP.
          pattern: "*.normalized.zarr"
      - "${prefix}.normalization.json":
          type: file
          description: Method, reference sample ID, query Lab statistics, and slide geometry.
          pattern: "*.normalization.json"
  versions:
    - "versions.yml":
        type: file
        description: Software versions.
        pattern: "versions.yml"
topics:
  versions:
    - "versions.yml":
        type: file
        description: Software versions.
        pattern: "versions.yml"
authors:
  - "@nictru"
maintainers:
  - "@nictru"
