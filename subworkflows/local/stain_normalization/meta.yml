# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: stain_normalization
description: Fit one stain reference and apply it to ingested histology slides using Squidpy.
keywords:
  - histology
  - stain normalization
  - whole-slide imaging
components:
  - squidpy/normalize
input:
  - ch_slides:
      type: file
      description: |
        Ingested WSIData stores and their aligned tissue masks.
        Structure: [ val(meta), path(slide), path(tissue_mask) ]
      pattern: "*.zarr"
  - method:
      type: string
      description: "Stain normalization method: macenko, reinhard, or vahadane."
  - reference_id:
      type: string
      description: Sample ID of the ingested slide used as the stain reference.
output:
  - slides:
      type: file
      description: |
        Normalized WSIData stores with reference provenance in the attributes.
        Structure: [ val(meta), path(slide) ]
      pattern: "*.normalized.zarr"
authors:
  - "@nictru"
maintainers:
  - "@nictru"
