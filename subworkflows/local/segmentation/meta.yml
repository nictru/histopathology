# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: segmentation
description: Segment nuclei or cells on ingested or stain-normalized slides using LazySlide.
keywords:
  - histology
  - nuclei
  - cell segmentation
components:
  - lazyslide/cells
  - lazyslide/tiletissues
  - spatialdata/segmentationagreement
input:
  - ch_slides:
      type: file
      description: |
        Ingested or stain-normalized WSIData stores.
        Structure: [ val(meta), path(slide) ]
      pattern: "*.zarr"
  - ch_slides_with_masks:
      type: file
      description: |
        Original ingested slides for previews, with aligned tissue masks for building segmentation grids.
        Structure: [ val(meta), path(original), path(tissue_mask) ]
      pattern: "*.zarr"
  - ch_tiles:
      type: file
      description: |
        Regular tile grids. Reused when the grid matches the model settings.
        Structure: [ val(meta), path(tiles) ]
      pattern: "*.tiles.zarr"
  - tile_px:
      type: integer
      description: Regular tile width in pixels.
  - tile_mpp:
      type: float
      description: Regular tile resolution in microns per pixel.
  - tile_overlap:
      type: float
      description: Regular tile overlap fraction.
  - background_fraction:
      type: float
      description: Maximum fraction of a tile that may fall outside tissue.
  - models:
      type: list
      description: Selected segmentation model names.
  - segmentation_mpp:
      type: float
      description: Segmentation tile resolution in microns per pixel.
output:
  - cells:
      type: file
      description: |
        SpatialData stores with segmentation polygons and provenance.
        Structure: [ val(meta), path(instances) ]
      pattern: "*.cells.zarr"
  - agreement:
      type: file
      description: |
        Per-slide agreement scores when two or more methods run.
        Structure: [ val(meta), path(agreement_csv) ]
      pattern: "*.segmentation_agreement.csv"
  - multiqc_files:
      type: file
      description: Per-module MultiQC custom content.
      pattern: "*_mqc.json"

authors:
  - "@nictru"
maintainers:
  - "@nictru"
